version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: price_monitor_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - price_network
  api:
    build: .
    container_name: price_monitor_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:123456@db:5432/postgres
      SECRET_KEY: supersecretkeychange_this_in_production_123456789
    volumes:
      - .:/app
    networks:
      - price_network
  nicegui:
    build: .
    container_name: price_monitor_nicegui
    command: python app_nice.py
    ports:
      - "8081:8081"
    depends_on:
      - api
    environment:
      API_URL: http://api:8000
    volumes:
      - .:/app
    networks:
      - price_network
volumes:
  postgres_data:
networks:
  price_network:
    driver: bridge
